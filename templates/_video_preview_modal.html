<!-- МОДАЛКА ВЫБОРА ГЛАВНОГО ПРЕВЬЮ ВИДЕО -->
<style>
    .video-card .preview-pick-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 32px;
        height: 32px;
        padding: 0;
        border: none;
        border-radius: var(--radius);
        background: rgba(0, 0, 0, 0.7);
        cursor: pointer;
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity var(--tr), background var(--tr), transform 0.15s;
    }
    .video-card:hover .preview-pick-btn { opacity: 1; }
    .video-card .preview-pick-btn:hover {
        background: var(--red);
        transform: scale(1.05);
    }
    .video-card .preview-pick-btn img {
        width: var(--icon-md);
        height: var(--icon-md);
        object-fit: contain;
        pointer-events: none;
    }
    .video-preview-intro {
        position: relative;
        padding: 6px 12px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-elevated, #141417);
        color: var(--text-muted);
        font-size: 0.78rem;
        margin-bottom: 10px;
    }
    .video-preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 0.6rem;
        max-height: 56vh;
        overflow-y: auto;
        padding: 2px;
    }
    .video-preview-item {
        position: relative;
        aspect-ratio: 16 / 9;
        border: 2px solid transparent;
        border-radius: 8px;
        overflow: hidden;
        background: #000;
        cursor: pointer;
        transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }
    .video-preview-item:hover {
        border-color: var(--red-disabled);
        transform: scale(1.02);
    }
    .video-preview-item.active {
        border-color: var(--red);
        box-shadow: 0 0 12px rgba(220, 53, 69, 0.7);
    }
    .video-preview-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: #1a1a1a;
    }
    .video-preview-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 3px 6px;
        background: rgba(0, 0, 0, 0.75);
        color: #f4f4f5;
        font-size: 0.68rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .video-preview-check {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--red);
        color: #fff;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
    }
    .video-preview-item.active .video-preview-check { display: flex; }
    .video-preview-current { color: #e6e7ea; font-weight: 600; }
    .video-edit-preview {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 18px;
        margin-bottom: 22px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg-surface);
    }
    .video-edit-preview-frame {
        width: 240px;
        max-width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 8px;
        overflow: hidden;
        background: #1a1a1a;
    }
    .video-edit-preview-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .video-edit-preview-info { min-width: 220px; }
    .preview-pick-btn-static {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(220, 53, 69, 0.32);
        background: rgba(220, 53, 69, 0.10);
        color: #e6e7ea;
        cursor: pointer;
    }
    .preview-pick-btn-static:hover { background: rgba(220, 53, 69, 0.26); }
    @media (hover: none), (pointer: coarse) {
        .video-card .preview-pick-btn { opacity: 1; width: 28px; height: 28px; }
        .video-card .preview-pick-btn img { width: 18px; height: 18px; }
    }
</style>

<div class="modal fade" id="videoPreviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content edit-modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Set preview for <span id="videoPreviewName"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="video-preview-intro" id="videoPreviewHint">
                    Frames start at 1:00 to skip the intro. Choose one, or keep the automatic frame.
                </div>
                <div class="video-preview-grid" id="videoPreviewGrid">
                    <div class="no-videos-msg">Loading…</div>
                </div>
            </div>
            <div class="modal-footer">
                <span class="me-auto text-muted small" id="videoPreviewStatus"></span>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="selectVideoPreviewBtn" disabled>Save preview</button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/video_preview_picker.js') }}"></script>
