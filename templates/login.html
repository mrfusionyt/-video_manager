<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoManager — Sign in</title>
  <style>
    :root {
      --bg: #121216;
      --surface: #1b1c22;
      --surface-2: #141417;
      --border: #303137;
      --text: #e6e7ea;
      --muted: #9ca3af;
      --red: #dc3545;
      --red-hover: #b52a38;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 0%, #202027 0%, var(--bg) 65%);
      color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .login-card {
      width: min(420px, calc(100vw - 32px));
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.55);
      padding: 30px 30px 26px;
    }
    .login-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
    .login-brand img {
      width: 54px; height: 54px; border-radius: 13px; object-fit: contain;
      background: #101014; border: 1px solid var(--border); padding: 6px;
    }
    .login-brand h1 { margin: 0; font-size: 21px; letter-spacing: .2px; }
    .login-brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 7px; }
    input[type=password] {
      width: 100%; padding: 12px 13px; border-radius: 10px;
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); font-size: 14px; outline: none;
    }
    input[type=password]:focus {
      border-color: var(--red); box-shadow: 0 0 0 3px rgba(220,53,69,.16);
    }
    .login-error {
      margin-top: 12px; padding: 10px 12px; border-radius: 9px;
      background: rgba(220,53,69,.12); border: 1px solid rgba(220,53,69,.35);
      color: #ff9aa4; font-size: 12px;
    }
    .login-hint {
      margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.5;
    }
    button {
      width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 10px;
      background: var(--red); color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background .15s ease, transform .1s ease;
    }
    button:hover { background: var(--red-hover); }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <form class="login-card" method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <div class="login-brand">
      <img src="/image/video.png" alt="VideoManager">
      <div>
        <h1>VideoManager</h1>
        <p>{% if enabled %}This interface is password protected{% else %}Set a password in Settings → Security{% endif %}</p>
      </div>
    </div>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <div class="login-hint">Local access on this PC is always allowed. Use the password when connecting over LAN or Tailscale.</div>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
