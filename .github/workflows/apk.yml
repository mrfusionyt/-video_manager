name: Build Android phone client APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag for uploading the APK (e.g. v1.0.19)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build signed APK (Android 16 target)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default `tools` package was removed from the SDK repository.
          packages: ''

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/release.jks
          chmod 600 android/app/release.jks

      - name: Resolve APK name
        run: |
          VERSION=$(python3 - <<'PY'
          import pathlib
          import re
          text = pathlib.Path('launcher.py').read_text(encoding='utf-8')
          print(re.search(r"CURRENT_VERSION\s*=\s*'([^']+)'", text).group(1))
          PY
          )
          APK_NAME="VideoManager-Phone-v${VERSION}.apk"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APK_PATH=$PWD/$APK_NAME" >> "$GITHUB_ENV"
          echo "APK name: $APK_NAME"

      - name: Build signed release APK
        env:
          VM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename and checksum APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"

      - name: Verify APK signature and SDK levels
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK_NAME"
          "$AAPT" dump badging "$APK_NAME" | grep -E '^(package|sdkVersion|targetSdkVersion|application-label)'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoManager-Phone-APK
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error

      - name: Attach APK to a release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" > /dev/null
          gh release upload "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --clobber
