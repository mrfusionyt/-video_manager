plugins {
    id 'com.android.application'
}

android {
    namespace 'com.videomanager.phone'
    compileSdk 36

    defaultConfig {
        applicationId 'com.videomanager.phone'
        minSdk 24
        targetSdk 36
        versionCode 119
        versionName '1.0.19'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def storePass = System.getenv('VM_KEYSTORE_PASSWORD') ?: ''
            def keyAliasName = System.getenv('VM_KEY_ALIAS') ?: ''
            def keyPass = System.getenv('VM_KEY_PASSWORD') ?: ''
            storeFile file('release.jks')
            storePassword storePass
            keyAlias keyAliasName
            keyPassword keyPass
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}
