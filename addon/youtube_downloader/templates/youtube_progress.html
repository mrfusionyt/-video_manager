{% extends "youtube_base.html" %}

{% block title %}Downloading...{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h4 class="card-title">Downloading</h4>

        <div class="current-video">
            <span class="icon" id="currentIcon">⏳</span>
            <span class="name" id="currentName">Starting…</span>
        </div>

        <div class="progress mb-3" style="height: 22px;">
            <div id="statusBar" class="progress-bar progress-bar-striped progress-bar-animated"
                 role="progressbar" style="width: 0%; background: #dc3545;">
                <span id="statusText">0%</span>
            </div>
        </div>

        <div class="d-flex gap-2 flex-wrap mb-2">
            <button id="cancelBtn" class="btn btn-danger" onclick="cancelTask()">Cancel</button>
            <a href="{{ url_for('youtube.index') }}" class="btn btn-secondary">← Back</a>
        </div>

        <div id="resultSection" style="display:none;">
            <h6 style="margin-top:1rem;">Downloaded files:</h6>
            <div id="resultGrid" class="result-grid"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const taskId = '{{ task.id }}';
    let finished = false;

    const PREVIEW_SEEK_SECONDS = 6;

    const currentIcon = document.getElementById('currentIcon');
    const currentName = document.getElementById('currentName');
    const statusBar = document.getElementById('statusBar');
    const statusText = document.getElementById('statusText');
    const cancelBtn = document.getElementById('cancelBtn');
    const resultSection = document.getElementById('resultSection');
    const resultGrid = document.getElementById('resultGrid');

    function progressLabel(s) {
        if (s.items_total > 1) {
            const perItem = 1 / s.items_total;
            const currentFraction = (s.progress_percent || 0) / 100;
            const overall = Math.min(100, ((s.items_done || 0) + currentFraction) * perItem * 100);
            return overall.toFixed(1);
        }
        return (s.progress_percent || 0).toFixed(1);
    }

    function seekPreview(videoEl) {
        try {
            const dur = videoEl.duration;
            if (!dur || isNaN(dur)) return;
            let target = PREVIEW_SEEK_SECONDS;
            if (dur < PREVIEW_SEEK_SECONDS * 2) {
                target = dur / 2;
            }
            videoEl.currentTime = target;
        } catch (e) {
        }
    }

    function renderResults(files) {
        if (!files || !files.length) return;
        resultSection.style.display = 'block';
        resultGrid.innerHTML = '';
        for (const f of files) {
            const a = document.createElement('a');
            a.className = 'result-card';
            a.href = '/youtube/media/' + taskId + '/' + encodeURIComponent(f.name);
            a.target = '_blank';
            a.title = f.name;

            const url = a.href;
            if (f.is_video) {
                const v = document.createElement('video');
                v.src = url;
                v.muted = true;
                v.playsInline = true;
                v.preload = 'metadata';
                v.addEventListener('loadedmetadata', function() {
                    seekPreview(v);
                }, { once: true });
                if (v.readyState >= 1) {
                    seekPreview(v);
                }
                a.appendChild(v);
            } else {
                const img = document.createElement('img');
                img.src = url;
                img.loading = 'lazy';
                a.appendChild(img);
            }

            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.textContent = f.name;
            a.appendChild(overlay);

            const hint = document.createElement('span');
            hint.className = 'open-hint';
            hint.textContent = '↗ Open';
            a.appendChild(hint);

            resultGrid.appendChild(a);
        }
    }

    function setStatus(s) {
        const label = progressLabel(s);
        statusBar.style.width = label + '%';
        statusText.textContent = label + '%';

        if (s.status === 'running' || s.status === 'starting') {
            statusBar.style.background = '#dc3545';
            statusBar.classList.add('progress-bar-animated');
            currentIcon.textContent = '⏳';
            if (s.current_video) {
                currentName.textContent = s.current_video;
            } else if (s.items_total > 1) {
                currentName.textContent = 'Collecting playlist… (' + s.items_total + ' items)';
            } else {
                currentName.textContent = 'Starting…';
            }
            return;
        }

        statusBar.classList.remove('progress-bar-animated');
        cancelBtn.disabled = true;

        if (s.status === 'complete') {
            statusBar.style.background = '#28a745';
            statusBar.style.width = '100%';
            statusText.textContent = '✅ Done';
            currentIcon.textContent = '✅';
            if (s.result_files && s.result_files.length) {
                currentName.textContent = 'Downloaded ' + s.result_files.length + ' file(s)';
            } else {
                currentName.textContent = 'Done';
            }
            renderResults(s.result_files || []);
        } else if (s.status === 'cancelled') {
            statusBar.style.background = '#ffc107';
            currentIcon.textContent = '⏹';
            currentName.textContent = 'Cancelled';
            renderResults(s.result_files || []);
            resultSection.style.display = 'block';
        } else if (s.status === 'error') {
            statusBar.style.background = '#dc3545';
            statusBar.style.width = '100%';
            statusText.textContent = '❌ Error';
            currentIcon.textContent = '❌';
            currentName.textContent = 'Error (code ' + (s.returncode != null ? s.returncode : '?') + ')';
            renderResults(s.result_files || []);
        }
    }

    let resultFilesCount = 0;

    async function poll() {
        if (finished) return;
        try {
            const r = await fetch('/youtube/state/' + taskId);
            if (!r.ok) {
                currentName.textContent = 'Task not found';
                finished = true;
                return;
            }
            const s = await r.json();
            setStatus(s);

            if (s.result_files && s.result_files.length > resultFilesCount) {
                resultFilesCount = s.result_files.length;
                renderResults(s.result_files);
            }

            if (s.status === 'complete' ||
                s.status === 'error' ||
                s.status === 'cancelled') {
                finished = true;
                return;
            }
        } catch (e) {
            console.error(e);
        }
        setTimeout(poll, 800);
    }

    async function cancelTask() {
        if (!confirm('Cancel this download?')) return;
        cancelBtn.disabled = true;
        try {
            await fetch('/youtube/cancel/' + taskId, { method: 'POST' });
        } catch (e) { console.error(e); }
    }

    poll();
</script>
{% endblock %}
