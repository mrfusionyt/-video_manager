<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PhotoClassifier — VideoManager</title>
<link rel="icon" type="image/png" href="{{ url_for('photo_classifier.favicon') }}">
<style>
  :root {
    --bg-app: #121212;
    --bg-surface: #1e1e1e;
    --bg-elevated: #2c2c2c;
    --bg-input: #2c2c2c;
    --border: #2c2c2c;
    --border-strong: #444;
    --text-primary: #e0e0e0;
    --text-secondary: #b0b0b0;
    --text-muted: #888;
    --red: #dc3545;
    --red-hover: #c82333;
    --green: #28a745;
    --radius: 8px;
    --radius-lg: 14px;
    --shadow-card: 0 2px 8px rgba(0,0,0,0.5);
    --shadow-modal: 0 8px 32px rgba(0,0,0,0.75);
    --tr: 0.2s ease;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent; touch-action: none;
    background: var(--bg-app);
    color: var(--text-primary);
    font-family: var(--font);
  }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* ---- Progress bar ---- */
  #progress-container { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--border); z-index: 10; }
  #progress-bar { height: 100%; background: var(--red); width: 0%; transition: width 0.25s ease; }

  /* ---- Header ---- */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--bg-surface);
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
    position: relative; z-index: 5;
  }
  .header-brand { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .header-brand img { height: 22px; }
  .header-spacer { flex: 1; }
  header button {
    background: rgba(220,53,69,0.10); color: #e6e7ea; border: 1px solid rgba(220,53,69,0.30);
    padding: 7px 12px; border-radius: var(--radius); cursor: pointer; font-size: 13px;
    font-weight: 550; letter-spacing: 0.01em;
    transition: all var(--tr); white-space: nowrap; touch-action: manipulation;
  }
  header button:hover { background: rgba(220,53,69,0.26); border-color: rgba(220,53,69,0.62); color: #fff; }
  header button:active { transform: scale(0.98); }
  header button:disabled { opacity: .35; cursor: not-allowed; }

  /* Back — same highlighted design as header Settings / Back in the main app */
  header a.header-back {
    display: inline-flex; align-items: center; justify-content: center;
    height: 38px; padding: 0 14px; margin-left: 4px;
    background: rgba(220,53,69,0.10); border: 1px solid rgba(220,53,69,0.30); border-radius: var(--radius);
    color: #e6e7ea; font-size: 13px; font-weight: 550; line-height: 1;
    text-decoration: none; white-space: nowrap; transition: all var(--tr);
  }
  header a.header-back:hover { background: rgba(220,53,69,0.26); border-color: rgba(220,53,69,0.62); color: #fff; }
  header a.header-back:active { transform: scale(0.96); }

  /* ---- Main image area ---- */
  #main { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; min-height: 0; padding: 6px; touch-action: none; }
  #img-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
  #photo {
    max-width: 100%; max-height: 100%; object-fit: contain;
    user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
    transition: filter 0.1s linear; will-change: filter, transform; transform-origin: center center;
    pointer-events: none;
  }
  #photo-placeholder { color: var(--text-muted); font-size: 15px; text-align: center; padding: 34px; line-height: 1.5; }

  /* Arrow navs (desktop) */
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(30,30,30,0.85); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color: var(--text-primary); border: 1px solid var(--border-strong);
    width: 62px; height: 140px; border-radius: var(--radius);
    font-size: 34px; line-height: 1; cursor: pointer; opacity: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 10; transition: opacity var(--tr), background var(--tr), transform var(--tr);
    user-select: none; touch-action: manipulation;
  }
  .nav:hover { opacity: 1; background: rgba(220,53,69,0.85); }
  .nav:active { transform: translateY(-50%) scale(0.95); }
  .nav#prev { left: 8px; border-radius: var(--radius) 0 0 var(--radius); }
  .nav#next { right: 8px; border-radius: 0 var(--radius) var(--radius) 0; }

  /* ---- Toolbar (brightness) ---- */
  #toolbar {
    display: flex; align-items: center; gap: 12px; justify-content: center; flex-wrap: wrap;
    padding: 10px 14px; background: var(--bg-surface); border-top: 1px solid var(--border);
    z-index: 5; position: relative; touch-action: manipulation;
  }
  #toolbar button {
    width: 42px; height: 42px; border-radius: var(--radius); border: 1px solid rgba(220,53,69,0.30);
    background: rgba(220,53,69,0.10); color: #e6e7ea; font-size: 19px; font-weight: 650;
    cursor: pointer; transition: all var(--tr); display: flex; align-items: center; justify-content: center;
  }
  #toolbar button:hover { background: rgba(220,53,69,0.26); border-color: rgba(220,53,69,0.62); color: #fff; }
  #toolbar button:active { transform: scale(0.9); }
  #brightness-value { font-family: Consolas, monospace; color: var(--text-secondary); font-size: 15px; min-width: 54px; text-align: center; }
  #counter { margin-left: auto; font-size: 15px; color: var(--text-muted); font-family: Consolas, monospace; padding-left: 12px; white-space: nowrap; }

  /* ---- Footer: action buttons ---- */
  footer {
    display: flex; gap: 12px; padding: 14px; background: var(--bg-surface);
    border-top: 1px solid var(--border); z-index: 5; position: relative;
  }
  .action-btn {
    flex: 1; display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 13px 8px; font-size: 16px; font-weight: 650;
    border: none; border-radius: 10px; cursor: pointer;
    transition: transform 0.08s, filter var(--tr); touch-action: manipulation;
    letter-spacing: 0.5px;
  }
  .action-btn:active { transform: scale(0.985); }
  .action-btn:disabled { opacity: .3; cursor: not-allowed; }
  #btn-nude { background: #7a1f29; color: #fff; }
  #btn-nude:hover:not(:disabled) { background: var(--red-hover); }
  #btn-not-nude { background: #3a3a3a; color: var(--text-secondary); }
  #btn-not-nude:hover:not(:disabled) { background: rgba(220,53,69,0.14); color: #fff; }

  /* ---- Settings modal ---- */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.72);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 16px; touch-action: auto;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--bg-surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg); padding: 22px; width: 520px; max-width: 95vw;
    max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-modal);
  }
  .modal h2 { margin-bottom: 16px; font-size: 17px; font-weight: 650; }
  .modal .field { margin-bottom: 12px; }
  .modal label { display: block; margin-bottom: 5px; font-size: 12px; color: var(--text-secondary); letter-spacing: 0.02em; }
  .modal .row { display: flex; gap: 8px; }
  .modal input {
    width: 100%; padding: 9px 11px; background: var(--bg-input); border: 1px solid var(--border-strong);
    border-radius: var(--radius); color: var(--text-primary); font-size: 13px; font-family: Consolas, monospace;
    transition: border-color var(--tr);
  }
  .modal input:focus { outline: none; border-color: var(--red); }
  .modal button {
    padding: 9px 15px; background: rgba(220,53,69,0.10); color: #e6e7ea;
    border: 1px solid rgba(220,53,69,0.30); border-radius: var(--radius); cursor: pointer; font-size: 13px;
    font-weight: 550; transition: all var(--tr); white-space: nowrap;
  }
  .modal button:hover { border-color: rgba(220,53,69,0.62); background: rgba(220,53,69,0.26); color: #fff; }
  .modal .primary { background: var(--red); border-color: var(--red); color: #fff; }
  .modal .primary:hover { background: var(--red-hover); }
  .modal .actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 18px; }
  .modal .actions button:first-child { margin-right: auto; }
  .modal .confirm-message { color: var(--text-primary); font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

  /* ---- Toast ---- */
  #toast {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(30,30,30,0.98); border: 1px solid var(--border-strong); color: var(--text-primary);
    padding: 10px 20px; border-radius: 8px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 200;
    max-width: 80vw; text-align: center;
  }
  #toast.show { opacity: 1; }
  #toast.error { border-color: var(--red); }

  /* ---- Mobile ---- */
  @media (max-width: 900px) {
    header { padding: 8px 10px; gap: 8px; }
    #main { padding: 4px; }
    .nav { width: 54px; height: 116px; font-size: 30px; }
    #toolbar { padding: 8px 10px; }
    #toolbar button { width: 38px; height: 38px; font-size: 17px; }
    #counter { font-size: 14px; }
    footer { padding: 12px; gap: 10px; }
    .action-btn { padding: 26px 8px; font-size: 16px; }
    .modal { padding: 16px; width: 90vw; }
  }
</style>
</head>
<body>
  <div id="progress-container"><div id="progress-bar"></div></div>

  <header>
    <span class="header-brand">PhotoClassifier</span>
    <span class="header-spacer"></span>
    <button id="btn-fullscreen" title="Fullscreen (F)">⛶</button>
    <button id="btn-undo" disabled title="Undo last move (Ctrl+Z)">↶ <span id="undoCount">0</span></button>
    <button id="btn-settings" title="Settings">⚙</button>
    <a href="{{ url_for('settings', profile=current_profile) }}" class="header-back" title="Back">Back</a>
  </header>

  <div id="main">
    <button class="nav" id="prev" title="Back (←)">‹</button>
    <button class="nav" id="next" title="Forward (→)">›</button>
    <div id="img-container">
      <img id="photo" alt="" draggable="false">
      <div id="photo-placeholder">Click ⚙ to select a photo folder</div>
    </div>
  </div>

  <div id="toolbar">
    <button id="b-down" title="Darker (↓)">☀−</button>
    <span id="brightness-value">1.00</span>
    <button id="b-up" title="Brighter (↑)">☀+</button>
    <button id="b-reset" title="Reset brightness (R)">↺</button>
    <span id="counter"></span>
  </div>

  <footer>
    <button class="action-btn" id="btn-not-nude" disabled>{{ app_labels.not_nude }}</button>
    <button class="action-btn" id="btn-nude" disabled>{{ app_labels.nude }}</button>
  </footer>

  <div class="modal-bg" id="settings-modal">
    <div class="modal">
      <h2>Settings</h2>
      <div class="field">
        <label>Photo folder (source)</label>
        <div class="row"><input type="text" id="source-folder" placeholder="Folder path or Browse..."><button onclick="pickFolder('source')">Browse…</button></div>
      </div>
      <div class="field">
        <label>Destination for the "{{ app_labels.not_nude }}" button</label>
        <div class="row"><input type="text" id="not-nude-folder" placeholder="Folder path or Browse..."><button onclick="pickFolder('not_nude')">Browse…</button></div>
      </div>
      <div class="field">
        <label>Destination for the "{{ app_labels.nude }}" button</label>
        <div class="row"><input type="text" id="nude-folder" placeholder="Folder path or Browse..."><button onclick="pickFolder('nude')">Browse…</button></div>
      </div>
      <div class="actions">
        <button onclick="restartServer()" title="Reload settings and rescan source">🔄 Restart Server</button>
        <button onclick="closeSettings()">Cancel</button>
        <button class="primary" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="confirm-modal">
    <div class="modal">
      <h2>Confirm</h2>
      <div class="confirm-message" id="confirm-message"></div>
      <div class="actions">
        <button type="button" id="confirm-cancel">Cancel</button>
        <button type="button" class="primary" id="confirm-ok">OK</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
const BP = window.location.pathname.replace(/\/+$/, '') || '/pv';

let images = [];
let currentIndex = 0;
let settings = { source: '', not_nude: '', nude: '', label_not_nude: '', label_nude: '' };
let brightness = 1.0;
let scale = 1.0;
let translateX = 0, translateY = 0;
let touchMode = 'none';
let initialDistance = 0;
let touchStartX = 0, touchStartY = 0;
let dragStartTouchX = 0, dragStartTouchY = 0;
let isDragging = false, dragStartX = 0, dragStartY = 0;

const $ = (id) => document.getElementById(id);
const setText = (id, txt) => { const el = $(id); if (el) el.textContent = txt; };

async function loadState() {
  try {
    const r = await fetch(BP + '/api/state');
    const data = await r.json();
    images = data.images || [];
    settings = data.settings || settings;

    const savedIndex = localStorage.getItem('lastPhotoIndex');
    if (savedIndex !== null && parseInt(savedIndex) < images.length) {
      currentIndex = parseInt(savedIndex);
    } else currentIndex = 0;

    setText('source-folder', settings.source || '');
    setText('not-nude-folder', settings.not_nude || '');
    setText('nude-folder', settings.nude || '');
  } catch (e) { images = []; }

  updateUI();
  render();
}

function updateUI() {
  setText('btn-not-nude', settings.label_not_nude || 'Not Nude');
  setText('btn-nude', settings.label_nude || 'Nude');
}

function updateUndoButton(count) {
  const btn = $('btn-undo');
  btn.disabled = count === 0;
  btn.title = count > 0 ? 'Undo last move (' + count + ' available)' : 'Nothing to undo';
  setText('undoCount', count);
}

async function render() {
  const img = $('photo'); const ph = $('photo-placeholder');
  const counter = $('counter'); const btnNN = $('btn-not-nude'); const btnN = $('btn-nude');
  const progressBar = $('progress-bar');

  scale = 1.0; translateX = 0; translateY = 0; applyTransform();

  if (images.length === 0) {
    img.style.display = 'none'; img.removeAttribute('src'); ph.style.display = 'block';
    ph.textContent = settings.source ? 'No images in the selected folder (or all are already sorted)' : 'Click ⚙ to select a photo folder';
    counter.textContent = ''; btnNN.disabled = true; btnN.disabled = true; applyBrightness();
    progressBar.style.width = '0%';
    return;
  }
  if (currentIndex < 0) currentIndex = images.length - 1;
  if (currentIndex >= images.length) currentIndex = images.length - 1;

  const name = images[currentIndex];
  img.src = BP + '/api/image?name=' + encodeURIComponent(name) + '&thumb=1';
  img.style.display = 'block'; ph.style.display = 'none';

  counter.textContent = (currentIndex + 1) + ' / ' + images.length;
  counter.title = name;
  btnNN.disabled = false; btnN.disabled = false; applyBrightness();

  progressBar.style.width = ((currentIndex + 1) / images.length * 100) + '%';
  localStorage.setItem('lastPhotoIndex', currentIndex);

  if (images.length > 1) {
    const nextName = images[(currentIndex + 1) % images.length];
    const pre = new Image();
    pre.src = BP + '/api/image?name=' + encodeURIComponent(nextName) + '&thumb=1';
  }
}

function applyBrightness() {
  const img = $('photo'); if (!img) return;
  img.style.filter = (brightness === 1.0) ? '' : 'brightness(' + brightness.toFixed(2) + ')';
  setText('brightness-value', brightness.toFixed(2));
}
function changeBrightness(delta) {
  if (images.length === 0) return;
  brightness = Math.max(0.1, Math.min(3.0, brightness + delta));
  applyBrightness();
}
function resetBrightness() { brightness = 1.0; applyBrightness(); }

function nextImage() { if (images.length === 0) return; currentIndex = (currentIndex + 1) % images.length; brightness = 1.0; render(); }
function prevImage() { if (images.length === 0) return; currentIndex = (currentIndex - 1 + images.length) % images.length; brightness = 1.0; render(); }

function applyTransform() {
  const img = $('photo');
  if (img) img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

// Zoom / drag
$('img-container').addEventListener('wheel', (e) => {
  if (images.length === 0) return;
  if (e.ctrlKey) return;
  if (scale > 1.0) {
    e.preventDefault();
    scale = Math.max(1.0, Math.min(5.0, scale + (e.deltaY > 0 ? -0.2 : 0.2)));
    if (scale === 1.0) { translateX = 0; translateY = 0; }
    applyTransform();
  } else {
    if (e.deltaY > 0) nextImage(); else prevImage();
  }
}, { passive: false });

$('img-container').addEventListener('mousedown', (e) => {
  if (scale > 1.0) {
    e.preventDefault();
    isDragging = true;
    dragStartX = e.clientX - translateX; dragStartY = e.clientY - translateY;
    $('img-container').style.cursor = 'grabbing';
  }
});
window.addEventListener('mousemove', (e) => {
  if (isDragging) { e.preventDefault(); translateX = e.clientX - dragStartX; translateY = e.clientY - dragStartY; applyTransform(); }
});
window.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; $('img-container').style.cursor = 'grab'; } });

// Touch: pinch zoom, drag, swipe
$('img-container').addEventListener('touchstart', (e) => {
  if (images.length === 0) return;
  if (e.touches.length === 2) {
    touchMode = 'pinch';
    initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
  } else if (e.touches.length === 1) {
    if (scale > 1.0) {
      touchMode = 'drag';
      dragStartTouchX = e.touches[0].clientX - translateX; dragStartTouchY = e.touches[0].clientY - translateY;
    } else {
      touchMode = 'swipe';
      touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
    }
  }
}, { passive: false });
$('img-container').addEventListener('touchmove', (e) => {
  if (touchMode === 'drag' && e.touches.length === 1) {
    e.preventDefault();
    translateX = e.touches[0].clientX - dragStartTouchX; translateY = e.touches[0].clientY - dragStartTouchY;
    applyTransform();
  } else if (touchMode === 'pinch' && e.touches.length === 2) {
    e.preventDefault();
    const d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
    if (initialDistance > 0) {
      scale = Math.max(1.0, Math.min(5.0, scale * (d / initialDistance)));
      if (scale === 1.0) { translateX = 0; translateY = 0; }
      applyTransform(); initialDistance = d;
    }
  }
}, { passive: false });
$('img-container').addEventListener('touchend', (e) => {
  if (touchMode === 'swipe') {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? nextImage() : prevImage(); }
  }
  if (e.touches.length === 0) touchMode = 'none';
}, { passive: false });

// API actions
async function classify(category) {
  if (images.length === 0) return;
  const label = settings[category];
  if (!label) { toast('Select a folder in Settings first', true); return; }
  const name = images[currentIndex];
  const r = await fetch(BP + '/api/classify', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, category }) });
  const data = await r.json();
  if (!data.ok) { toast('Error: ' + data.error, true); return; }
  images = data.images;
  if (images.length === 0) currentIndex = 0; else if (currentIndex >= images.length) currentIndex = images.length - 1;
  brightness = 1.0; updateUndoButton(data.undo_count); render();
}

async function undoLast() {
  const r = await fetch(BP + '/api/undo', { method: 'POST' });
  const data = await r.json();
  updateUndoButton(data.undo_count || 0);
  if (!data.ok) { toast('Error: ' + data.error, true); return; }
  images = data.images;
  if (currentIndex >= images.length) currentIndex = Math.max(0, images.length - 1);
  brightness = 1.0; render();
}

let confirmResolve = null;
function showConfirm(message) {
  return new Promise((resolve) => {
    confirmResolve = resolve;
    $('confirm-message').textContent = message;
    $('confirm-modal').classList.add('open');
  });
}
function closeConfirm(result) {
  $('confirm-modal').classList.remove('open');
  if (confirmResolve) { const resolve = confirmResolve; confirmResolve = null; resolve(result); }
}

async function deleteImage() {
  if (images.length === 0) return;
  if (!(await showConfirm('Move the file to the Recycle Bin?\n\n' + images[currentIndex]))) return;
  const name = images[currentIndex];
  const r = await fetch(BP + '/api/delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name }) });
  const data = await r.json();
  if (!data.ok) { toast('Error: ' + data.error, true); return; }
  images = data.images;
  if (currentIndex >= images.length) currentIndex = Math.max(0, images.length - 1);
  brightness = 1.0; updateUndoButton(data.undo_count); render();
}

async function pickFolder(key) {
  const titles = { source: 'Select folder', not_nude: 'Select folder for "' + (settings.label_not_nude || 'Not Nude') + '"', nude: 'Select folder for "' + (settings.label_nude || 'Nude') + '"' };
  toast('Opening folder picker…');
  const r = await fetch(BP + '/api/pick-folder', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ title: titles[key] || 'Select folder' }) });
  const data = await r.json();
  if (data.path) {
    if (key === 'source') setText('source-folder', data.path);
    else if (key === 'not_nude') setText('not-nude-folder', data.path);
    else setText('nude-folder', data.path);
  } else if (data.error) toast(data.error, true);
}

async function saveSettings() {
  const body = {
    source: $('source-folder').value,
    not_nude: $('not-nude-folder').value,
    nude: $('nude-folder').value,
    label_not_nude: $('label-not-nude').value.trim() || 'Not Nude',
    label_nude: $('label-nude').value.trim() || 'Nude'
  };
  const r = await fetch(BP + '/api/save-settings', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  const data = await r.json();
  if (!data.ok) { toast('Error: ' + data.error, true); return; }
  settings = body; images = data.images; currentIndex = 0; brightness = 1.0;
  updateUI(); updateUndoButton(data.undo_count); render(); closeSettings(); toast('Settings saved');
}

async function restartServer() {
  try {
    const r = await fetch(BP + '/api/restart', { method: 'POST' });
    const data = await r.json();
    if (!data.ok) { toast('Restart failed', true); return; }
    settings = data.settings || settings; images = data.images || [];
    setText('source-folder', settings.source || '');
    setText('not-nude-folder', settings.not_nude || '');
    setText('nude-folder', settings.nude || '');
    updateUI(); updateUndoButton(data.undo_count || 0); render(); closeSettings(); toast('Server restarted');
  } catch (e) { toast('Error: ' + e.message, true); }
}

function openSettings() { $('settings-modal').classList.add('open'); }
function closeSettings() { $('settings-modal').classList.remove('open'); }
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => toast(`Error: ${err.message}`, true));
  else document.exitFullscreen();
}

let toastTimer = null;
function toast(msg, isError) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

$('confirm-ok').onclick = () => closeConfirm(true);
$('confirm-cancel').onclick = () => closeConfirm(false);
$('confirm-modal').onclick = (e) => { if (e.target === $('confirm-modal')) closeConfirm(false); };
$('btn-fullscreen').onclick = toggleFullscreen;
$('btn-settings').onclick = openSettings;
$('btn-undo').onclick = undoLast;
$('prev').onclick = prevImage; $('next').onclick = nextImage;
$('b-up').onclick = () => changeBrightness(+0.1);
$('b-down').onclick = () => changeBrightness(-0.1);
$('b-reset').onclick = resetBrightness;
$('btn-not-nude').onclick = () => classify('not_nude');
$('btn-nude').onclick = () => classify('nude');

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.ctrlKey && e.key === 'z') { undoLast(); e.preventDefault(); return; }
  if (e.key === 'ArrowRight') { nextImage(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { prevImage(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { changeBrightness(+0.1); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { changeBrightness(-0.1); e.preventDefault(); }
  else if (e.key === 'Delete') { deleteImage(); e.preventDefault(); }
  else if (e.key === '1') { classify('not_nude'); }
  else if (e.key === '2') { classify('nude'); }
  else if (e.key === 'r' || e.key === 'R') { resetBrightness(); }
  else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
  else if (e.key === 'Escape') { closeSettings(); closeConfirm(false); }
});

loadState();
</script>
</body>
</html>
